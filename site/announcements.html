<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Announcements — Catalyst</title>

    <link
        rel="stylesheet"
        href="assets/built/screen.css"
    >

    <style>

        :root {
            --black: #111111;
            --white: #f7f7f2;
            --muted: #707070;
            --border: rgba(17,17,17,.18);
            --accent: #d9ff00;
        }

        body {
            margin: 0;

            background: var(--white);
            color: var(--black);
        }

        .announcements-page {
            min-height: 100vh;
        }


        /* NAVIGATION */

        .announcements-nav {
            position: sticky;
            top: 0;
            z-index: 100;

            border-bottom: 1px solid var(--border);

            background: var(--white);
        }

        .announcements-nav-inner {
            width: min(
                1400px,
                calc(100% - 48px)
            );

            min-height: 78px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .announcements-logo {
            color: var(--black);

            text-decoration: none;

            font-family:
                "Arial Black",
                Arial,
                sans-serif;

            font-size: 28px;
            font-weight: 900;

            letter-spacing: -1.5px;
        }

        .announcements-nav-links {
            display: flex;
            align-items: center;

            gap: 28px;
        }

        .announcements-nav-links a {
            color: var(--black);

            text-decoration: none;

            font-family: monospace;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: .08em;

            text-transform: uppercase;
        }

        .announcements-nav-links a:hover {
            text-decoration: underline;
        }

        .announcements-login {
            border: 1px solid var(--black);

            padding: 12px 18px;
        }


        /* MAIN */

        .announcements-container {
            width: min(
                1100px,
                calc(100% - 48px)
            );

            margin: 0 auto;
        }

        .announcements-hero {
            padding: 90px 0 65px;

            border-bottom: 1px solid var(--black);
        }

        .announcements-eyebrow {
            margin: 0 0 20px;

            font-family: monospace;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: .12em;

            text-transform: uppercase;
        }

        .announcements-title {
            margin: 0;

            font-family:
                "Arial Black",
                Arial,
                sans-serif;

            font-size: clamp(
                58px,
                9vw,
                115px
            );

            line-height: .82;

            letter-spacing: -.07em;

            text-transform: uppercase;
        }

        .announcements-intro {
            max-width: 700px;

            margin: 40px 0 0;

            font-size: 20px;

            line-height: 1.45;
        }


        /* LIST */

        .announcements-list {
            padding: 55px 0 100px;
        }

        .announcement-card {
            padding: 35px 0;

            border-top: 1px solid var(--black);
        }

        .announcement-card:last-child {
            border-bottom: 1px solid var(--black);
        }

        .announcement-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 30px;
        }

        .announcement-club {
            font-family: monospace;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: .1em;

            text-transform: uppercase;
        }

        .announcement-date {
            color: var(--muted);

            font-family: monospace;

            font-size: 11px;

            white-space: nowrap;
        }

        .announcement-title {
            margin: 25px 0 15px;

            font-family:
                "Arial Black",
                Arial,
                sans-serif;

            font-size: clamp(
                30px,
                4vw,
                55px
            );

            line-height: .95;

            letter-spacing: -.055em;

            text-transform: uppercase;
        }

        .announcement-content {
            max-width: 800px;

            margin: 0;

            color: #444444;

            font-size: 16px;

            line-height: 1.65;

            white-space: pre-wrap;
        }


        /* EMPTY / ERROR */

        .announcement-message {
            padding: 100px 20px;

            text-align: center;

            border-top: 1px solid var(--black);
            border-bottom: 1px solid var(--black);
        }

        .announcement-message h2 {
            margin: 0 0 12px;

            font-family:
                "Arial Black",
                Arial,
                sans-serif;

            font-size: 40px;

            letter-spacing: -.04em;
        }

        .announcement-message p {
            margin: 0;

            color: var(--muted);
        }


        @media (max-width: 650px) {

            .announcements-nav-inner,
            .announcements-container {
                width: calc(100% - 30px);
            }

            .announcements-nav-inner {
                min-height: 68px;
            }

            .announcements-nav-links {
                gap: 12px;
            }

            .announcements-nav-links a:not(
                .announcements-login
            ) {
                display: none;
            }

            .announcements-hero {
                padding: 65px 0 45px;
            }

            .announcement-top {
                flex-direction: column;

                gap: 10px;
            }

            .announcement-date {
                white-space: normal;
            }
        }

    </style>

</head>


<body>

<div class="announcements-page">

    <nav class="announcements-nav">

        <div class="announcements-nav-inner">

            <a
                href="index.html"
                class="announcements-logo"
            >
                CATALYST
            </a>

            <div class="announcements-nav-links">

                <a href="events.html">
                    Events
                </a>

                <a href="my-events.html">
                    My Events
                </a>

                <a href="clubs.html">
                    Clubs
                </a>

                <a href="announcements.html">
                    Announcements
                </a>

                <a
                    href="login.html"
                    class="announcements-login"
                >
                    Login
                </a>

            </div>

        </div>

    </nav>


    <main class="announcements-container">

        <header class="announcements-hero">

            <p class="announcements-eyebrow">
                Catalyst / Campus Updates
            </p>

            <h1 class="announcements-title">
                ANNOUNCEMENTS
            </h1>

            <p class="announcements-intro">
                Important updates, notices and messages
                from the communities running Catalyst.
            </p>

        </header>


        <section
            id="announcementsList"
            class="announcements-list"
        >

            <div class="announcement-message">

                <h2>
                    LOADING...
                </h2>

                <p>
                    Getting the latest campus updates.
                </p>

            </div>

        </section>

    </main>

</div>


<script src="assets/js/catalyst-announcements.js"></script>

</body>

</html>
