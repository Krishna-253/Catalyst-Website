<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Club — Catalyst</title>

    <link
        rel="stylesheet"
        href="assets/built/screen.css"
    >

    <style>

        body {
            background: #f7f7f5;
        }


        /* -------------------------------------------------
           NAVIGATION
        ------------------------------------------------- */

        .club-nav {
            border-bottom: 1px solid #ddd;
            background: #f7f7f5;
        }

        .club-nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .club-logo {
            color: #111;
            text-decoration: none;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .club-nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .club-nav-link {
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }

        .club-nav-link:hover {
            text-decoration: underline;
        }


        /* -------------------------------------------------
           PAGE
        ------------------------------------------------- */

        .club-page {
            max-width: 1100px;
            margin: 70px auto;
            padding: 0 24px;
        }


        /* -------------------------------------------------
           HERO
        ------------------------------------------------- */

        .club-hero {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 35px;
            align-items: center;

            padding-bottom: 55px;
            border-bottom: 1px solid #ddd;
        }

        .club-logo-box {
            width: 150px;
            height: 150px;

            border-radius: 18px;
            border: 1px solid #ddd;
            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .club-logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .club-logo-placeholder {
            font-size: 42px;
            font-weight: 800;
            color: #111;
        }

        .club-eyebrow {
            margin: 0 0 10px;

            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            color: #777;
        }

        .club-title {
            margin: 0 0 15px;

            font-size: clamp(42px, 7vw, 72px);
            line-height: 0.95;
            letter-spacing: -3px;
        }

        .club-description {
            max-width: 750px;

            margin: 0;

            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }


        /* -------------------------------------------------
           STATS
        ------------------------------------------------- */

        .club-stats {
            display: flex;
            gap: 50px;

            margin-top: 28px;
        }

        .club-stat-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
        }

        .club-stat-number {
            margin-top: 5px;

            font-size: 25px;
            font-weight: 700;
            color: #111;
        }


        /* -------------------------------------------------
           CONTACT
        ------------------------------------------------- */

        .club-contact {
            margin-top: 25px;
            font-size: 14px;
            color: #555;
        }

        .club-contact a {
            color: #111;
        }


        /* -------------------------------------------------
           SECTIONS
        ------------------------------------------------- */

        .club-section {
            margin-top: 65px;
        }

        .club-section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;

            margin-bottom: 25px;

            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }

        .club-section-title {
            margin: 0;

            font-size: 28px;
            letter-spacing: -1px;
        }

        .club-section-count {
            font-size: 13px;
            color: #777;
        }


        /* -------------------------------------------------
           EVENT GRID
        ------------------------------------------------- */

        .club-events {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;
        }

        .club-event {
            background: white;
            border: 1px solid #ddd;
            border-radius: 14px;

            overflow: hidden;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .club-event:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);
        }

        .club-event-image {
            height: 180px;
            background: #e9e9e6;

            overflow: hidden;
        }

        .club-event-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .club-event-content {
            padding: 22px;
        }

        .club-event-category {
            margin-bottom: 8px;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;

            color: #777;
        }

        .club-event-title {
            margin: 0 0 12px;

            font-size: 24px;
            line-height: 1.05;
            letter-spacing: -1px;
        }

        .club-event-date {
            margin-bottom: 6px;

            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .club-event-venue {
            margin-bottom: 18px;

            font-size: 13px;
            color: #777;
        }

        .club-event-button {
            display: inline-block;

            padding: 10px 15px;

            border: 1px solid #111;
            border-radius: 7px;

            color: #111;
            text-decoration: none;

            font-size: 13px;
            font-weight: 600;
        }

        .club-event-button:hover {
            background: #111;
            color: white;
        }


        /* -------------------------------------------------
           EMPTY / ERROR
        ------------------------------------------------- */

        .club-empty {
            padding: 45px 25px;

            background: white;
            border: 1px solid #ddd;
            border-radius: 14px;

            color: #777;
        }

        .club-empty strong {
            display: block;

            margin-bottom: 7px;

            color: #111;
            font-size: 18px;
        }

        .club-error {
            padding: 80px 20px;
            text-align: center;
        }

        .club-error h1 {
            margin-bottom: 12px;

            font-size: 42px;
            letter-spacing: -2px;
        }

        .club-error p {
            color: #777;
        }

        .club-back {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 18px;

            background: #111;
            color: white;

            border-radius: 7px;

            text-decoration: none;
        }


        /* -------------------------------------------------
           MOBILE
        ------------------------------------------------- */

        @media (max-width: 700px) {

            .club-nav-right {
                gap: 12px;
            }

            .club-nav-link {
                font-size: 12px;
            }

            .club-page {
                margin-top: 40px;
            }

            .club-hero {
                grid-template-columns: 1fr;
            }

            .club-logo-box {
                width: 110px;
                height: 110px;
            }

            .club-title {
                font-size: 48px;
                letter-spacing: -2px;
            }

            .club-stats {
                gap: 30px;
            }

            .club-events {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <!-- NAVIGATION -->

    <nav class="club-nav">

        <div class="club-nav-inner">

            <a
                href="index.html"
                class="club-logo"
            >
                CATALYST
            </a>


            <div class="club-nav-right">

                <a
                    href="events.html"
                    class="club-nav-link"
                >
                    Events
                </a>


                <a
                    href="clubs.html"
                    class="club-nav-link"
                >
                    Clubs
                </a>


                <a
                    href="announcements.html"
                    class="club-nav-link"
                >
                    Announcements
                </a>


                <a
                    href="login.html"
                    class="club-nav-link"
                >
                    Login
                </a>

            </div>

        </div>

    </nav>


    <!-- PAGE -->

    <main
        id="clubPage"
        class="club-page"
    >

        <div class="club-empty">

            Loading club...

        </div>

    </main>


    <script
        src="assets/js/catalyst-club.js"
    ></script>

</body>

</html>
